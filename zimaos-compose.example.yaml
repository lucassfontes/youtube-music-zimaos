name: youtube-music-zimaos
services:
  # Executa uma vez para criar pastas persistentes com acesso do UID 1000.
  preparar-pastas:
    image: busybox:1.36.1
    user: "0:0"
    restart: "no"
    volumes:
      - /DATA/AppData/YouTube_Music:/biblioteca
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      mkdir -p /biblioteca/dados /biblioteca/Musica /biblioteca/Videos &&
      chown -R 1000:1000 /biblioteca/dados &&
      chown 1000:1000 /biblioteca/Musica /biblioteca/Videos

  youtube-music:
    depends_on:
      preparar-pastas:
        condition: service_completed_successfully
    image: ghcr.io/lucassfontes/youtube-music-zimaos:1.5.6
    container_name: youtube-music-zimaos
    restart: unless-stopped
    init: true
    ports:
      - "8787:8787"
    environment:
      TZ: Europe/Brussels
      COOKIE_SECURE: "false"
    volumes:
      # A biblioteca fica em /DATA/AppData/YouTube_Music, mesmo após reiniciar/recriar o container.
      - /DATA/AppData/YouTube_Music/dados:/config
      - /DATA/AppData/YouTube_Music/Musica:/music
      - /DATA/AppData/YouTube_Music/Videos:/videos
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

# Metadados exibidos ao importar como aplicativo personalizado no ZimaOS.
# Para caminhos absolutos na importação pelo ZimaOS, gere
# zimaos-compose.yaml no menu do inicializador.
x-casaos:
  id: com.lucassfontes.youtube-music-zimaos
  main: youtube-music
  index: /
  scheme: http
  port_map: "8787"
  icon: "https://raw.githubusercontent.com/lucassfontes/youtube-music-zimaos/main/app/static/icon.png"
  title:
    en_US: YouTube Music ZimaOS
    pt_BR: YouTube Music ZimaOS
  tagline:
    en_US: Search, listen to audio and save music on your server
    pt_BR: Buscar, ouvir e salvar músicas no servidor
  description:
    en_US: Private local music and video download manager with an audio-only player.
    pt_BR: Gerenciador local para baixar MP3 e MP4 por nome do canal, com player de áudio.
  category: Entertainment
  author: Lucas Fontes
  developer: Lucas Fontes
  version: "1.5.6"
  architectures:
    - amd64
